# Test profile – uses the same live MySQL but validates schema only (no DDL changes).
# Tests that need a real DB must have MySQL running and the 'test' profile active.
# Unit / slice tests (MockMvc, Mockito) do NOT load the full context and bypass this.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vms_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:mysqlpass_1}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

